# ============================================================
# docker-compose.yml — boussole + PostgreSQL
# ⚠️ MONO-INSTANCE ASSUMÉE (F8) : UN seul process `app`.
# Les rate-limits + le cache dashboard vivent en mémoire par
# process — scaler en N réplicas diviserait les tentatives
# autorisées par N. Multi-réplicas = rate-limit partagé
# (Redis/base) à ajouter AVANT toute mise à l'échelle.
# PostgreSQL partagé ≠ limitation multi-instances.
# Sans ce fichier, l'app reste monobloc sur SQLite
# (zéro service externe) — même contrat d'API, parité testée.
#
#   docker compose up -d --build
#   docker compose logs -f app
# ============================================================
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: boussole
      # Secrets hors du fichier tracké — renseignés dans .env (voir .env.example) :
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: boussole
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boussole -d boussole']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      # Secrets hors du fichier tracké — POSTGRES_PASSWORD / JWT_SECRET /
      # ADMIN_PASSWORD viennent de .env (voir .env.example, openssl rand -hex 32) :
      DATABASE_URL: postgres://boussole:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}@db:5432/boussole
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      # Compte enseignant amorcé au premier démarrage (PUIS MODIFIER !) :
      ADMIN_EMAIL: ${ADMIN_EMAIL:-maitre@ecole.dz}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD manquant dans .env}
      # Derrière nginx : l'IP réelle des élèves (limiteur par compte) :
      TRUST_PROXY: '1'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
