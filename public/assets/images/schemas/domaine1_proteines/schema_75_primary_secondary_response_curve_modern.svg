<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
  <rect width="1200" height="760" rx="28" fill="#f8fbff"/>
  <text x="600" y="68" text-anchor="middle" font-size="38" font-weight="800" fill="#0f172a">الاستجابة الثانوية أسرع وأقوى من الاستجابة الأولية</text>

  <rect x="90" y="120" width="1020" height="540" rx="26" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <g stroke="#94a3b8" stroke-width="3">
    <line x1="180" y1="580" x2="1040" y2="580"/>
    <line x1="180" y1="190" x2="180" y2="580"/>
  </g>
  <text x="165" y="182" text-anchor="end" font-size="22" fill="#475569">كمية الأجسام المضادة</text>
  <text x="1040" y="615" text-anchor="end" font-size="22" fill="#475569">الزمن بعد التعرض للمستضد</text>

  <path d="M210 570 C300 565 345 520 390 470 C440 415 470 385 515 430 C560 475 590 530 640 570" fill="none" stroke="#60a5fa" stroke-width="8"/>
  <path d="M650 570 C700 560 730 470 770 330 C805 210 850 170 900 210 C955 255 995 380 1040 570" fill="none" stroke="#dc2626" stroke-width="8"/>

  <g>
    <line x1="245" y1="580" x2="245" y2="525" stroke="#1d4ed8" stroke-width="4" stroke-dasharray="8 8"/>
    <line x1="710" y1="580" x2="710" y2="500" stroke="#b91c1c" stroke-width="4" stroke-dasharray="8 8"/>
    <text x="245" y="610" text-anchor="middle" font-size="20" fill="#1d4ed8">تعرض أول</text>
    <text x="710" y="610" text-anchor="middle" font-size="20" fill="#b91c1c">تعرض ثانٍ</text>
  </g>

  <g>
    <rect x="250" y="150" width="240" height="52" rx="14" fill="#dbeafe"/>
    <text x="370" y="183" text-anchor="middle" font-size="22" fill="#1d4ed8">استجابة أولية: بطيئة وضعيفة</text>
    <rect x="690" y="150" width="260" height="52" rx="14" fill="#fee2e2"/>
    <text x="820" y="183" text-anchor="middle" font-size="22" fill="#b91c1c">استجابة ثانوية: أسرع وأقوى</text>
  </g>

  <g fill="#334155" font-size="22" text-anchor="middle">
    <text x="445" y="505">زمن كمون أطول</text>
    <text x="835" y="255">زمن كمون أقصر + ذروة أعلى</text>
  </g>

  <rect x="180" y="686" width="840" height="42" rx="20" fill="#0f172a" opacity="0.92"/>
  <text x="600" y="714" text-anchor="middle" font-size="24" fill="#ffffff">إذا قصُر زمن الكمون وارتفعت الذروة عند التعرض الثاني، فذلك يعني وجود خلايا ذاكرة مناعية جاهزة للاستجابة السريعة</text>
</svg>
