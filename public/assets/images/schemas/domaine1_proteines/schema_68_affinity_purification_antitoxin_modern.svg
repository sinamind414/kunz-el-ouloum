<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
  <rect width="1200" height="760" rx="28" fill="#f8fbff"/>
  <text x="600" y="68" text-anchor="middle" font-size="38" font-weight="800" fill="#0f172a">الارتباط النوعي يسمح بعزل أجسام مضادة مضادة للسم</text>

  <rect x="80" y="130" width="300" height="520" rx="26" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <text x="230" y="178" text-anchor="middle" font-size="30" font-weight="700" fill="#1d4ed8">1) عمود يحمل المستضد</text>
  <rect x="180" y="240" width="100" height="280" rx="40" fill="#dbeafe" stroke="#60a5fa" stroke-width="6"/>
  <g fill="#ef4444">
    <circle cx="205" cy="270" r="12"/><circle cx="255" cy="300" r="12"/><circle cx="225" cy="345" r="12"/><circle cx="260" cy="395" r="12"/><circle cx="215" cy="450" r="12"/>
  </g>
  <text x="230" y="575" text-anchor="middle" font-size="24" fill="#334155">المستضد مثبت داخل الدعامة</text>

  <path d="M400 390 H550" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
  <text x="475" y="360" text-anchor="middle" font-size="24" fill="#15803d">تمرير المصل</text>

  <rect x="580" y="130" width="260" height="520" rx="26" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <text x="710" y="178" text-anchor="middle" font-size="30" font-weight="700" fill="#7c3aed">2) تثبت الأجسام الموافقة فقط</text>
  <g stroke="#7c3aed" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M660 290 l18 -34 l18 34"/>
    <path d="M720 340 l18 -34 l18 34"/>
    <path d="M680 410 l18 -34 l18 34"/>
    <path d="M735 455 l18 -34 l18 34"/>
  </g>
  <g fill="#cbd5e1">
    <circle cx="650" cy="255" r="12"/><circle cx="770" cy="290" r="12"/><circle cx="645" cy="365" r="12"/><circle cx="775" cy="410" r="12"/>
  </g>
  <text x="710" y="575" text-anchor="middle" font-size="24" fill="#334155">الأجسام غير الموافقة تعبر، والموافقة ترتبط نوعياً</text>

  <path d="M860 390 H1010" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <text x="935" y="360" text-anchor="middle" font-size="24" fill="#92400e">غسل ثم استخلاص</text>

  <rect x="1025" y="130" width="95" height="520" rx="26" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <g stroke="#7c3aed" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M1048 270 l16 -32 l16 32"/>
    <path d="M1070 335 l16 -32 l16 32"/>
    <path d="M1048 400 l16 -32 l16 32"/>
    <path d="M1070 465 l16 -32 l16 32"/>
  </g>
  <text x="1072" y="575" text-anchor="middle" font-size="22" fill="#334155">أجسام مضادة نقية</text>

  <rect x="150" y="686" width="900" height="42" rx="20" fill="#0f172a" opacity="0.92"/>
  <text x="600" y="714" text-anchor="middle" font-size="24" fill="#ffffff">إمكانية عزل الأجسام المضادة الموافقة لمستضد معين تثبت أن الارتباط بينهما شديد النوعية</text>
</svg>
