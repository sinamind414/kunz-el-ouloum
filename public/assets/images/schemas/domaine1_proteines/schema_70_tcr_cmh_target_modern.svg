<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
  <rect width="1200" height="760" rx="28" fill="#f8fbff"/>
  <text x="600" y="68" text-anchor="middle" font-size="38" font-weight="800" fill="#0f172a">الاستجابة الخلوية تبدأ بتعرف نوعي بين الخلية التائية والخلية الهدف</text>

  <rect x="80" y="130" width="450" height="520" rx="26" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <text x="305" y="176" text-anchor="middle" font-size="30" font-weight="700" fill="#1d4ed8">الخلية التائية القاتلة (LTc)</text>
  <circle cx="305" cy="390" r="145" fill="#dbeafe" stroke="#60a5fa" stroke-width="6"/>
  <g fill="#7c3aed">
    <rect x="392" y="345" width="18" height="32" rx="9"/>
    <rect x="392" y="387" width="18" height="32" rx="9"/>
    <rect x="392" y="429" width="18" height="32" rx="9"/>
  </g>
  <text x="305" y="580" text-anchor="middle" font-size="24" fill="#334155">تحمل مستقبلات نوعية تتعرف على المحدد المعروض على CMH-I</text>

  <path d="M470 390 H720" stroke="#16a34a" stroke-width="9" stroke-linecap="round"/>
