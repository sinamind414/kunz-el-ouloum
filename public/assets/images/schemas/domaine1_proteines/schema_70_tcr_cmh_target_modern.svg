  <g>
    <path d="M560 350 q35 38 70 0" fill="none" stroke="#7c3aed" stroke-width="7"/>
    <path d="M560 430 q35 -38 70 0" fill="none" stroke="#7c3aed" stroke-width="7"/>
  </g>

  <rect x="740" y="130" width="380" height="520" rx="26" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <text x="930" y="176" text-anchor="middle" font-size="30" font-weight="700" fill="#dc2626">الخلية الهدف</text>
  <circle cx="930" cy="390" r="140" fill="#fee2e2" stroke="#ef4444" stroke-width="6"/>
  <g fill="#f59e0b">
    <rect x="825" y="355" width="22" height="34" rx="8"/>
    <rect x="825" y="400" width="22" height="34" rx="8"/>
    <rect x="825" y="445" width="22" height="34" rx="8"/>
  </g>
  <g fill="#ef4444">
    <circle cx="855" cy="372" r="11"/><circle cx="855" cy="417" r="11"/><circle cx="855" cy="462" r="11"/>
