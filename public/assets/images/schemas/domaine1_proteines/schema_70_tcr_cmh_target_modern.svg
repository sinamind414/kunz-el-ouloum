  <text x="930" y="580" text-anchor="middle" font-size="24" fill="#334155">تعرض محدداً مستضدياً على جزيئات CMH-I</text>

  <rect x="170" y="686" width="860" height="42" rx="20" fill="#0f172a" opacity="0.92"/>
  <text x="600" y="714" text-anchor="middle" font-size="24" fill="#ffffff">إذا وُجد التوافق بين مستقبل الخلية التائية والمحدد المعروض على CMH-I تبدأ الاستجابة الخلوية الموجهة ضد الخلية الهدف</text>
