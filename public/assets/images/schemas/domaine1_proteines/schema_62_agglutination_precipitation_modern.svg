  <text x="875" y="560" text-anchor="middle" font-size="24" fill="#334155">المعقدات الكبيرة تصبح غير ذائبة فتترسب</text>

  <rect x="170" y="686" width="860" height="42" rx="20" fill="#0f172a" opacity="0.92"/>
  <text x="600" y="714" text-anchor="middle" font-size="24" fill="#ffffff">هذه الظواهر دليل مباشر على أن الارتباط بين المستضد والجسم المضاد نوعي ويمكن أن يسهّل إقصاء الهدف</text>
