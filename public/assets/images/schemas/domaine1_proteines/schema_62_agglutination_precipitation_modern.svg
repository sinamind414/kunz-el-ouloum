  <text x="325" y="560" text-anchor="middle" font-size="24" fill="#334155">جسم مضاد واحد يربط أكثر من هدف فيكوّن شبكة مرئية</text>

  <rect x="640" y="130" width="470" height="520" rx="26" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
