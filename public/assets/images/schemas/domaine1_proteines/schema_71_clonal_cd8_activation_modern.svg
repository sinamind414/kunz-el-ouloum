<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
  <rect width="1200" height="760" rx="28" fill="#f8fbff"/>
  <text x="600" y="68" text-anchor="middle" font-size="38" font-weight="800" fill="#0f172a">بعد التعرف النوعي يحدث تكاثر نسيلي وتميّز للخلايا التائية القاتلة</text>

  <rect x="80" y="150" width="240" height="420" rx="24" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <circle cx="200" cy="320" r="95" fill="#dbeafe" stroke="#60a5fa" stroke-width="6"/>
  <text x="200" y="495" text-anchor="middle" font-size="24" fill="#334155">خلية تائية نوعية واحدة</text>

  <path d="M340 320 H500" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
  <text x="420" y="290" text-anchor="middle" font-size="24" fill="#15803d">إشارة IL-2 + تنشيط</text>

  <rect x="520" y="150" width="260" height="420" rx="24" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <g fill="#bfdbfe" stroke="#3b82f6" stroke-width="4">
    <circle cx="600" cy="260" r="42"/><circle cx="700" cy="260" r="42"/>
    <circle cx="600" cy="370" r="42"/><circle cx="700" cy="370" r="42"/>
  </g>
  <text x="650" y="495" text-anchor="middle" font-size="24" fill="#334155">تكاثر نسيلي لخلايا تحمل نفس النوعية</text>

  <path d="M800 320 H900" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <text x="850" y="290" text-anchor="middle" font-size="24" fill="#92400e">تمايز</text>

  <rect x="920" y="150" width="200" height="420" rx="24" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <g>
    <circle cx="1020" cy="255" r="45" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
    <circle cx="1020" cy="365" r="45" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="5"/>
    <circle cx="1020" cy="475" r="45" fill="#93c5fd" stroke="#1e40af" stroke-width="5"/>
  </g>
  <text x="1020" y="620" text-anchor="middle" font-size="23" fill="#334155">خلايا قاتلة فعالة + خلايا ذاكرة</text>

  <rect x="150" y="680" width="900" height="42" rx="20" fill="#0f172a" opacity="0.92"/>
  <text x="600" y="708" text-anchor="middle" font-size="24" fill="#ffffff">الاستجابة الخلوية ليست فعلاً فردياً؛ بل تتضخم بتكاثر نسيلي ثم تعطي خلايا فعالة قادرة على القتل الموجه</text>
</svg>
