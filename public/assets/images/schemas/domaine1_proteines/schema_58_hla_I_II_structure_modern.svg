<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
  <rect width="1200" height="760" rx="30" fill="#f8fbff"/>
  <text x="600" y="68" text-anchor="middle" font-size="38" font-weight="800" fill="#0f172a">HLA / CMH : بطاقة الهوية المناعية للخلية</text>

  <rect x="70" y="120" width="300" height="540" rx="26" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <text x="220" y="168" text-anchor="middle" font-size="30" font-weight="700" fill="#1d4ed8">CMH-I / HLA-I</text>
  <circle cx="220" cy="380" r="130" fill="#dbeafe" stroke="#60a5fa" stroke-width="6"/>
  <g fill="#1d4ed8">
    <rect x="160" y="290" width="18" height="60" rx="9"/>
    <rect x="210" y="270" width="18" height="80" rx="9"/>
    <rect x="260" y="300" width="18" height="55" rx="9"/>
  </g>
  <g fill="#f59e0b">
    <circle cx="170" cy="280" r="16"/><circle cx="219" cy="255" r="16"/><circle cx="270" cy="290" r="16"/>
  </g>
  <text x="220" y="540" text-anchor="middle" font-size="24" fill="#334155">يوجد على أغلب الخلايا المنواة</text>
  <text x="220" y="582" text-anchor="middle" font-size="20" fill="#475569">يعرض بطاقة الذات للخلايا التائية</text>

  <rect x="430" y="120" width="340" height="540" rx="26" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <text x="600" y="168" text-anchor="middle" font-size="30" font-weight="700" fill="#0f766e">منطقة التعرف المركزي</text>
  <rect x="505" y="240" width="190" height="280" rx="36" fill="#dcfce7" stroke="#22c55e" stroke-width="6"/>
  <rect x="530" y="275" width="26" height="110" rx="13" fill="#0f766e"/>
  <rect x="587" y="255" width="26" height="140" rx="13" fill="#0f766e"/>
  <rect x="644" y="280" width="26" height="105" rx="13" fill="#0f766e"/>
  <g fill="#ef4444">
    <circle cx="543" cy="252" r="18"/>
    <circle cx="600" cy="230" r="18"/>
    <circle cx="657" cy="257" r="18"/>
  </g>
  <text x="600" y="560" text-anchor="middle" font-size="24" fill="#334155">هذه الجزيئات السطحية تمثل</text>
  <text x="600" y="594" text-anchor="middle" font-size="24" font-weight="700" fill="#0f5132">هوية مناعية ذاتية</text>

  <rect x="830" y="120" width="300" height="540" rx="26" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <text x="980" y="168" text-anchor="middle" font-size="30" font-weight="700" fill="#7c3aed">CMH-II / HLA-II</text>
  <circle cx="980" cy="380" r="130" fill="#ede9fe" stroke="#a78bfa" stroke-width="6"/>
  <g fill="#7c3aed">
    <rect x="920" y="285" width="18" height="60" rx="9"/>
    <rect x="970" y="265" width="18" height="85" rx="9"/>
    <rect x="1020" y="295" width="18" height="60" rx="9"/>
  </g>
  <g fill="#f43f5e">
    <rect x="905" y="245" width="48" height="18" rx="9"/>
    <rect x="955" y="225" width="48" height="18" rx="9"/>
    <rect x="1005" y="250" width="48" height="18" rx="9"/>
  </g>
  <text x="980" y="540" text-anchor="middle" font-size="24" fill="#334155">يوجد على الخلايا المقدمة للمستضد</text>
  <text x="980" y="582" text-anchor="middle" font-size="20" fill="#475569">يساعد على توجيه الاستجابة المناعية</text>

  <rect x="220" y="688" width="760" height="42" rx="20" fill="#0f172a" opacity="0.92"/>
  <text x="600" y="716" text-anchor="middle" font-size="24" fill="#ffffff">اختلاف جزيئات CMH / HLA بين الأفراد يعني اختلاف بطاقة الذات، وهذا يفسر رفض الطعم غير المتوافق</text>
</svg>
