<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 860">
  <rect width="1300" height="860" rx="28" fill="#f8fbff"/>
  <text x="650" y="68" text-anchor="middle" font-size="40" font-weight="800" fill="#0f172a">الشفرة الوراثية : قراءة الرامزات وتحديد البدء والتوقف</text>

  <rect x="90" y="130" width="1120" height="620" rx="26" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <g font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="255" y="220">القاعدة 1</text>
    <text x="650" y="220">القاعدة 2</text>
    <text x="1040" y="220">القراءة الوظيفية</text>
  </g>
  <g>
    <rect x="150" y="270" width="210" height="90" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="255" y="325" text-anchor="middle" font-size="36" font-weight="700" fill="#1d4ed8">A U G</text>
    <rect x="545" y="270" width="210" height="90" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="650" y="325" text-anchor="middle" font-size="32" font-weight="700" fill="#166534">Methionine</text>
    <rect x="910" y="270" width="220" height="90" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <text x="1020" y="325" text-anchor="middle" font-size="30" font-weight="700" fill="#92400e">رامزة بداية</text>
  </g>
  <g>
    <rect x="150" y="420" width="210" height="90" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
    <text x="255" y="475" text-anchor="middle" font-size="34" font-weight="700" fill="#b91c1c">U A A</text>
    <rect x="545" y="420" width="210" height="90" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
    <text x="650" y="475" text-anchor="middle" font-size="30" font-weight="700" fill="#b91c1c">Stop</text>
    <rect x="910" y="420" width="220" height="90" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
    <text x="1020" y="475" text-anchor="middle" font-size="30" font-weight="700" fill="#b91c1c">رامزة توقف</text>
  </g>
  <g>
    <rect x="150" y="570" width="210" height="90" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/>
    <text x="255" y="625" text-anchor="middle" font-size="34" font-weight="700" fill="#6d28d9">U U U</text>
    <rect x="545" y="570" width="210" height="90" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/>
    <text x="650" y="625" text-anchor="middle" font-size="30" font-weight="700" fill="#6d28d9">Phenylalanine</text>
    <rect x="910" y="570" width="220" height="90" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
    <text x="1020" y="625" text-anchor="middle" font-size="28" font-weight="700" fill="#0369a1">مثال على القراءة</text>
  </g>
  <text x="650" y="790" text-anchor="middle" font-size="24" fill="#475569">يقرأ الريبوزوم الرامزات على ARNm لتحديد الحمض الأميني الموافق، مع AUG للبداية و UAA/UAG/UGA للتوقف</text>
</svg>
