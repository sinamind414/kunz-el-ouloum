<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="#f7fbff"/>
<rect x="70" y="120" width="1260" height="700" rx="28" fill="white" stroke="#d5dee8" stroke-width="4"/>
<text x="700" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#17233b">تركيب نيكليوتيد ARN</text>
<text x="700" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#51627a">النيكليوتيد الواحد = فوسفات + ريبوز + قاعدة آزوتية</text>
<rect x="150" y="270" width="260" height="220" rx="26" fill="#dbeafe" stroke="#2f6fed" stroke-width="4"/>
<text x="280.0" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2f6fed">فوسفات</text>
<text x="280.0" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#17233b">مجموعة حمضية</text>
<rect x="570" y="270" width="260" height="220" rx="26" fill="#dcfce7" stroke="#198754" stroke-width="4"/>
<text x="700.0" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#198754">ريبوز</text>
<text x="700.0" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#17233b">سكر خماسي</text>
<rect x="990" y="270" width="260" height="220" rx="26" fill="#fef3c7" stroke="#a16207" stroke-width="4"/>
<text x="1120.0" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#a16207">قاعدة آزوتية</text>
<text x="1120.0" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#17233b">A / U / G / C</text>
<line x1="410" y1="380" x2="570" y2="380" stroke="#f59e0b" stroke-width="10"/>
<polygon points="570,380 535,360 535,400" fill="#f59e0b"/>
<line x1="830" y1="380" x2="990" y2="380" stroke="#f59e0b" stroke-width="10"/>
<polygon points="990,380 955,360 955,400" fill="#f59e0b"/>
<text x="700" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#51627a">ترتيب الارتباط مهم: فوسفات — ريبوز — قاعدة آزوتية</text>
<text x="700" y="785" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#51627a">لوحة دعم: هذا التفكيك يساعد على التمييز بين ARN و ADN.</text>
