<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
  <rect width="1200" height="760" rx="28" fill="#f8fbff"/>
  <text x="600" y="68" text-anchor="middle" font-size="38" font-weight="800" fill="#0f172a">بعد التعرف، تطلق الخلية التائية القاتلة جزيئات تؤدي إلى موت الخلية الهدف</text>

  <rect x="80" y="130" width="420" height="520" rx="26" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <text x="290" y="176" text-anchor="middle" font-size="30" font-weight="700" fill="#1d4ed8">خلية تائية قاتلة</text>
  <circle cx="290" cy="390" r="140" fill="#dbeafe" stroke="#60a5fa" stroke-width="6"/>
  <g fill="#7c3aed">
    <circle cx="360" cy="330" r="14"/><circle cx="378" cy="370" r="14"/><circle cx="360" cy="410" r="14"/>
  </g>
  <text x="290" y="580" text-anchor="middle" font-size="24" fill="#334155">حبيبات سامة: برفورينات / غرانزيمات</text>

  <path d="M430 390 H720" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
  <polygon points="720,390 690,375 690,405" fill="#16a34a"/>
  <text x="575" y="360" text-anchor="middle" font-size="24" fill="#15803d">إفراز موجّه نحو الخلية الهدف</text>

  <rect x="740" y="130" width="380" height="520" rx="26" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <text x="930" y="176" text-anchor="middle" font-size="30" font-weight="700" fill="#dc2626">خلية هدف في طور الإقصاء</text>
  <circle cx="930" cy="390" r="138" fill="#fee2e2" stroke="#ef4444" stroke-width="6"/>
  <circle cx="930" cy="390" r="45" fill="#0f172a"/>
  <g fill="#22c55e">
    <circle cx="805" cy="390" r="12"/><circle cx="825" cy="345" r="12"/><circle cx="825" cy="435" r="12"/>
  </g>
  <g stroke="#38bdf8" stroke-width="5" stroke-dasharray="8 8">
    <line x1="820" y1="390" x2="1040" y2="390"/>
    <line x1="930" y1="280" x2="930" y2="500"/>
  </g>
  <text x="930" y="580" text-anchor="middle" font-size="24" fill="#334155">تشكّل ثقوب ودخول جزيئات قاتلة ⟶ موت الخلية الهدف</text>

  <rect x="170" y="686" width="860" height="42" rx="20" fill="#0f172a" opacity="0.92"/>
  <text x="600" y="714" text-anchor="middle" font-size="24" fill="#ffffff">القتل هنا تماسّي وموجّه: تتعرف الخلية التائية القاتلة أولاً، ثم تُطلق آليات إقصاء تؤدي إلى موت الخلية المصابة</text>
</svg>
