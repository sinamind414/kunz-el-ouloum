<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="#f7fbff"/>
<rect x="70" y="120" width="1260" height="700" rx="28" fill="white" stroke="#d5dee8" stroke-width="4"/>
<text x="700" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#17233b">بنية ARN</text>
<text x="700" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#51627a">ARN سلسلة واحدة تُقرأ وتُبنى في الاتجاه 5′ → 3′</text>
<rect x="190" y="300" width="1020" height="150" rx="60" fill="#e0f2fe" stroke="#38bdf8" stroke-width="5"/>
<text x="280" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#2f6fed">5′</text>
<text x="1120" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#2f6fed">3′</text>
<circle cx="360" cy="375" r="42" fill="#fde68a" stroke="#334155" stroke-width="3"/>
<text x="360" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17233b">A</text>
<circle cx="510" cy="375" r="42" fill="#fbcfe8" stroke="#334155" stroke-width="3"/>
<text x="510" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17233b">U</text>
<circle cx="660" cy="375" r="42" fill="#bfdbfe" stroke="#334155" stroke-width="3"/>
<text x="660" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17233b">G</text>
<circle cx="810" cy="375" r="42" fill="#bbf7d0" stroke="#334155" stroke-width="3"/>
<text x="810" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17233b">C</text>
<circle cx="960" cy="375" r="42" fill="#ddd6fe" stroke="#334155" stroke-width="3"/>
<text x="960" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17233b">U</text>
<text x="700" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#51627a">سلسلة واحدة — ريبوز — يوراسيل بدل الثايمين</text>
<text x="700" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#17233b">القواعد الممكنة على ARN: A و U و G و C</text>
<text x="700" y="785" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#51627a">التركيز البيداغوجي: ARN أحادي السلسلة بخلاف ADN الثنائي السلسلة.</text>
</svg>