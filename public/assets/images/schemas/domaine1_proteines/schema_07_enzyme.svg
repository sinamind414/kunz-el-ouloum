<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
  <rect width="1200" height="760" rx="28" fill="#f8fbff"/>
  <text x="600" y="68" text-anchor="middle" font-size="38" font-weight="800" fill="#0f172a">الإنزيمات : تخصص بنيوي، موقع فعال، وتسريع للتفاعل</text>

  <rect x="90" y="130" width="1020" height="540" rx="26" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <path d="M260 500 C220 390 290 260 405 250 C515 242 585 340 555 455 C535 535 425 590 320 560 C290 552 275 535 260 500z" fill="#dbeafe" stroke="#2563eb" stroke-width="6"/>
  <path d="M395 355 C435 325 470 345 485 385 C470 430 430 445 390 420 C375 395 377 372 395 355z" fill="#ffffff" stroke="#1d4ed8" stroke-width="4"/>
  <text x="390" y="620" text-anchor="middle" font-size="24" fill="#334155">الإنزيم يملك موقعاً فعالاً ذا شكل نوعي</text>

  <polygon points="700,350 760,310 820,350 820,430 760,470 700,430" fill="#fcd34d" stroke="#d97706" stroke-width="5"/>
  <text x="760" y="525" text-anchor="middle" font-size="24" fill="#334155">مادة التفاعل</text>

  <line x1="560" y1="390" x2="690" y2="390" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
  <polygon points="690,390 662,376 662,404" fill="#16a34a"/>
  <text x="625" y="360" text-anchor="middle" font-size="24" fill="#15803d">تكامل بنيوي</text>

  <rect x="900" y="250" width="180" height="220" rx="26" fill="#fee2e2" stroke="#ef4444" stroke-width="5"/>
  <text x="990" y="330" text-anchor="middle" font-size="28" font-weight="700" fill="#b91c1c">E + S</text>
  <text x="990" y="385" text-anchor="middle" font-size="22" fill="#7f1d1d">معقد إنزيم-ركيزة</text>
  <text x="600" y="720" text-anchor="middle" font-size="24" fill="#475569">بفضل هذا التكامل يخفض الإنزيم طاقة التنشيط ويسرّع التفاعل دون أن يستهلك</text>
</svg>
