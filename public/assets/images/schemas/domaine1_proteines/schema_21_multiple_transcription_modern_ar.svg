<text x="700" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#51627a">كلما زاد عدد إنزيمات بوليميراز ARN على نفس المورثة زادت كمية ARNm الرسول المنتجة.</text>
<text x="700" y="785" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#51627a">وثيقة حدسية: خيوط ARNm الأقصر تمثل بداية النسخ، والأطول تمثل تقدمه على المورثة.</text>
