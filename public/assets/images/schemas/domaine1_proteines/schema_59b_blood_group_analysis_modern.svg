  <rect x="200" y="730" width="900" height="46" rx="20" fill="#0f172a" opacity="0.92"/>
  <text x="650" y="760" text-anchor="middle" font-size="24" fill="#ffffff">منطق التراص يثبت أن الخلايا تحمل بطاقات سطحية حقيقية، وهذا يهيئ مباشرة لفهم CMH ورفض الطعم</text>
