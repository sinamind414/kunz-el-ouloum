<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
  <rect width="1200" height="760" rx="28" fill="#f8fbff"/>
  <text x="600" y="68" text-anchor="middle" font-size="38" font-weight="800" fill="#0f172a">عند التعرض الثاني تُفعّل خلايا الذاكرة بسرعة أكبر من الخلايا البكر</text>

  <rect x="90" y="140" width="470" height="500" rx="26" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <text x="325" y="186" text-anchor="middle" font-size="30" font-weight="700" fill="#1d4ed8">التعرض الأول</text>
  <circle cx="240" cy="360" r="80" fill="#dbeafe" stroke="#60a5fa" stroke-width="5"/>
  <path d="M360 360 H470" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="500" cy="360" r="70" fill="#bbf7d0" stroke="#22c55e" stroke-width="5"/>
  <text x="325" y="560" text-anchor="middle" font-size="24" fill="#334155">تكوين خلايا ذاكرة بعد استجابة أولية</text>

  <rect x="640" y="140" width="470" height="500" rx="26" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <text x="875" y="186" text-anchor="middle" font-size="30" font-weight="700" fill="#dc2626">التعرض الثاني</text>
  <circle cx="760" cy="360" r="70" fill="#bbf7d0" stroke="#16a34a" stroke-width="5"/>
  <path d="M835 360 H960" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <g fill="#fecaca" stroke="#ef4444" stroke-width="4">
    <circle cx="995" cy="300" r="36"/><circle cx="1045" cy="360" r="36"/><circle cx="995" cy="420" r="36"/>
  </g>
  <text x="875" y="560" text-anchor="middle" font-size="24" fill="#334155">تنشيط سريع ⟶ تكاثر سريع ⟶ خلايا فعالة كثيرة</text>

  <rect x="170" y="684" width="860" height="42" rx="20" fill="#0f172a" opacity="0.92"/>
  <text x="600" y="712" text-anchor="middle" font-size="24" fill="#ffffff">خلايا الذاكرة تحتاج زمناً أقل كي تتنشط، لذلك تكون الاستجابة الثانية أسرع وأكثر فعالية من الاستجابة الأولى</text>
</svg>
