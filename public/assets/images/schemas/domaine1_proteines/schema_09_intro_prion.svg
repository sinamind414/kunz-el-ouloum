<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">وضعية انطلاق: البريون</title>
  <desc id="desc">لوحة افتتاحية أكثر كثافة تربط بين بروتين طبيعي وبريون مرضي وأثره على النسيج العصبي.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f3fff6"/>
      <stop offset="100%" stop-color="#eef7ff"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)" rx="36"/>
  <text x="700" y="68" text-anchor="middle" font-size="42" font-weight="800" fill="#0f172a">من بروتين عادي إلى مرض عصبي : ما الذي تغيّر؟</text>

  <rect x="70" y="120" width="360" height="250" rx="28" fill="#ffffff" stroke="#d8eadf" stroke-width="4"/>
  <text x="250" y="170" text-anchor="middle" font-size="32" font-weight="700" fill="#0f5132">بروتين عادي</text>
  <path d="M150 285 c30-105 165-70 145 18 c-10 42-40 75-78 84 c-45 10-84-15-96-58 c-4-16-3-28 3-44 c5-14 13-24 26-40z" fill="#e9d5ff" stroke="#7c3aed" stroke-width="10"/>
  <path d="M195 315 c40-70 120-45 92 22 c-18 42-70 58-106 30" fill="none" stroke="#7c3aed" stroke-width="14" stroke-linecap="round"/>
  <text x="250" y="340" text-anchor="middle" font-size="25" fill="#334155">طيّ مستقر ⟶ وظيفة سليمة</text>

  <rect x="520" y="120" width="360" height="250" rx="28" fill="#ffffff" stroke="#f3d3d9" stroke-width="4"/>
  <text x="700" y="170" text-anchor="middle" font-size="32" font-weight="700" fill="#b42318">بريون مرضي</text>
  <path d="M600 315 l46-86 l72 138 l48-94 l55 84" fill="none" stroke="#d92d20" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="760" cy="285" r="18" fill="#d92d20"/>
  <circle cx="805" cy="325" r="16" fill="#f04438"/>
  <text x="700" y="340" text-anchor="middle" font-size="25" fill="#5f2120">تغيّر في الشكل ⟶ اختلال في الوظيفة</text>

  <rect x="970" y="120" width="360" height="250" rx="28" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <text x="1150" y="170" text-anchor="middle" font-size="32" font-weight="700" fill="#1d4ed8">أثر نسيجي</text>
  <g opacity="0.95">
    <circle cx="1070" cy="245" r="28" fill="#d8b4a3"/>
    <circle cx="1180" cy="295" r="36" fill="#caa08f"/>
    <circle cx="1245" cy="255" r="30" fill="#d8b9a9"/>
  </g>
  <g fill="#f8fafc" stroke="#94a3b8" stroke-width="3">
    <circle cx="1050" cy="235" r="40"/><circle cx="1150" cy="290" r="54"/><circle cx="1240" cy="250" r="45"/>
    <circle cx="1090" cy="335" r="42"/><circle cx="1215" cy="345" r="48"/>
  </g>
  <text x="1150" y="340" text-anchor="middle" font-size="24" fill="#334155">مظهر إسفنجي يوحي بتخرب النسيج العصبي</text>

  <path d="M430 245 h70" stroke="#98a2b3" stroke-width="8" stroke-linecap="round"/>
  <path d="M880 245 h70" stroke="#98a2b3" stroke-width="8" stroke-linecap="round"/>

  <rect x="150" y="460" width="1100" height="250" rx="36" fill="#0f5132"/>
  <text x="700" y="535" text-anchor="middle" font-size="42" font-weight="800" fill="#ffffff">سؤال الانطلاق</text>
  <text x="700" y="600" text-anchor="middle" font-size="32" fill="#d7f4df">كيف يؤدي تغيّر بنية بروتين إلى وظيفة جديدة أو إلى مرض؟</text>
  <text x="700" y="652" text-anchor="middle" font-size="28" fill="#d7f4df">الخطوة التالية في الوحدة : من أين تأتي بنية البروتين؟ من المورثة، ثم الاستنساخ، ثم الترجمة</text>
</svg>
