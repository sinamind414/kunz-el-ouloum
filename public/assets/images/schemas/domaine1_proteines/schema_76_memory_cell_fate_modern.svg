<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
  <rect width="1200" height="760" rx="28" fill="#f8fbff"/>
  <text x="600" y="68" text-anchor="middle" font-size="38" font-weight="800" fill="#0f172a">بعد التعرض الأول لا تختفي كل الخلايا: يتكون رصيد من خلايا الذاكرة</text>

  <rect x="90" y="140" width="1020" height="500" rx="26" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <rect x="130" y="240" width="220" height="220" rx="24" fill="#dbeafe" stroke="#60a5fa" stroke-width="6"/>
  <circle cx="240" cy="350" r="70" fill="#bfdbfe" stroke="#2563eb" stroke-width="5"/>
  <text x="240" y="505" text-anchor="middle" font-size="24" fill="#334155">خلية نوعية قبل التنشيط</text>

  <path d="M370 350 H540" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
  <text x="455" y="320" text-anchor="middle" font-size="24" fill="#15803d">تعرض أول + انتقاء نسيلي</text>

  <rect x="560" y="185" width="220" height="150" rx="24" fill="#fee2e2" stroke="#ef4444" stroke-width="6"/>
  <circle cx="670" cy="260" r="48" fill="#fecaca" stroke="#dc2626" stroke-width="5"/>
  <text x="670" y="365" text-anchor="middle" font-size="24" fill="#334155">خلايا فعالة قصيرة العمر</text>

  <rect x="560" y="395" width="220" height="150" rx="24" fill="#dcfce7" stroke="#22c55e" stroke-width="6"/>
  <circle cx="670" cy="470" r="48" fill="#bbf7d0" stroke="#15803d" stroke-width="5"/>
  <text x="670" y="575" text-anchor="middle" font-size="24" fill="#334155">خلايا ذاكرة طويلة البقاء</text>

  <path d="M800 470 H980" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <text x="890" y="440" text-anchor="middle" font-size="24" fill="#92400e">تبقى لوقت طويل</text>

  <rect x="990" y="395" width="90" height="150" rx="24" fill="#ecfccb" stroke="#84cc16" stroke-width="5"/>
  <g fill="#16a34a">
    <circle cx="1035" cy="430" r="12"/><circle cx="1035" cy="470" r="12"/><circle cx="1035" cy="510" r="12"/>
  </g>
  <text x="1035" y="575" text-anchor="middle" font-size="20" fill="#334155">مخزون ذاكرة</text>

  <rect x="180" y="684" width="840" height="42" rx="20" fill="#0f172a" opacity="0.92"/>
  <text x="600" y="712" text-anchor="middle" font-size="24" fill="#ffffff">سرعة الاستجابة الثانوية لا تأتي من الصفر؛ بل من خلايا ذاكرة تشكلت أثناء التعرض الأول وبقيت جاهزة للتنشيط من جديد</text>
</svg>
