<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
  <rect width="1200" height="760" rx="28" fill="#f8fbff"/>
  <text x="600" y="68" text-anchor="middle" font-size="38" font-weight="800" fill="#0f172a">تنشيط المتممة قد ينتهي بثقب الغشاء وإقصاء الخلية الهدف</text>

  <rect x="80" y="130" width="480" height="520" rx="26" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <text x="320" y="178" text-anchor="middle" font-size="30" font-weight="700" fill="#1d4ed8">1) ارتباط الجسم المضاد بالمستضد</text>
  <circle cx="320" cy="390" r="150" fill="#fecaca" stroke="#dc2626" stroke-width="6"/>
  <g stroke="#7c3aed" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M205 300 l18 -36 l18 36"/>
    <path d="M290 250 l18 -36 l18 36"/>
    <path d="M380 290 l18 -36 l18 36"/>
    <path d="M405 390 l18 -36 l18 36"/>
  </g>
  <g fill="#ef4444">
    <circle cx="232" cy="258" r="12"/><circle cx="320" cy="215" r="12"/><circle cx="410" cy="250" r="12"/><circle cx="438" cy="350" r="12"/>
  </g>
  <text x="320" y="600" text-anchor="middle" font-size="24" fill="#334155">تشكّل المعقد مستضد–ضد يفتح باب تنشيط المتممة</text>

  <rect x="640" y="130" width="480" height="520" rx="26" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <text x="880" y="178" text-anchor="middle" font-size="30" font-weight="700" fill="#0f766e">2) معقد الهجوم الغشائي</text>
  <circle cx="880" cy="390" r="150" fill="#fee2e2" stroke="#ef4444" stroke-width="6"/>
  <circle cx="880" cy="390" r="42" fill="#0f172a"/>
  <g fill="#22c55e">
    <circle cx="880" cy="215" r="18"/><circle cx="990" cy="270" r="18"/><circle cx="1035" cy="390" r="18"/><circle cx="990" cy="510" r="18"/><circle cx="880" cy="565" r="18"/><circle cx="770" cy="510" r="18"/><circle cx="725" cy="390" r="18"/><circle cx="770" cy="270" r="18"/>
  </g>
  <g stroke="#38bdf8" stroke-width="5" stroke-dasharray="10 10">
    <line x1="880" y1="230" x2="880" y2="550"/>
    <line x1="730" y1="390" x2="1030" y2="390"/>
  </g>
  <text x="880" y="600" text-anchor="middle" font-size="24" fill="#334155">تجميع بروتينات المتممة يكوّن ثقوباً تؤدي إلى تمزق الغشاء</text>

  <rect x="170" y="686" width="860" height="42" rx="20" fill="#0f172a" opacity="0.92"/>
  <text x="600" y="714" text-anchor="middle" font-size="24" fill="#ffffff">الأجسام المضادة لا تكتفي بالارتباط؛ بل قد تطلق آليات فعالة مثل المتممة لإقصاء الهدف</text>
</svg>
