<text x="700" y="785" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#51627a">خلاصة التركيب البروتيني: تُنسخ المعلومة، ثم تُترجم، ثم يُوجَّه البروتين إلى شكله أو مكان عمله.</text>
