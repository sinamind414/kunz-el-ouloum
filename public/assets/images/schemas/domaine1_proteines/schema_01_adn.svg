<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
  <rect width="1200" height="760" rx="28" fill="#f8fbff"/>
  <text x="600" y="68" text-anchor="middle" font-size="38" font-weight="800" fill="#0f172a">ADN : الدعامة المزدوجة للمعلومة الوراثية</text>

  <rect x="90" y="130" width="1020" height="540" rx="26" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
  <path d="M420 220 C340 300 340 420 420 500 C500 580 500 660 420 720" fill="none" stroke="#60a5fa" stroke-width="22" stroke-linecap="round"/>
  <path d="M780 220 C860 300 860 420 780 500 C700 580 700 660 780 720" fill="none" stroke="#f472b6" stroke-width="22" stroke-linecap="round"/>
  <g stroke="#94a3b8" stroke-width="6">
    <line x1="460" y1="250" x2="740" y2="250"/>
    <line x1="430" y1="330" x2="770" y2="330"/>
    <line x1="450" y1="410" x2="750" y2="410"/>
    <line x1="430" y1="490" x2="770" y2="490"/>
    <line x1="460" y1="570" x2="740" y2="570"/>
  </g>
  <g font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="510" y="240">A</text><text x="690" y="240">T</text>
    <text x="495" y="320">C</text><text x="705" y="320">G</text>
    <text x="510" y="400">G</text><text x="690" y="400">C</text>
    <text x="495" y="480">T</text><text x="705" y="480">A</text>
    <text x="510" y="560">A</text><text x="690" y="560">T</text>
  </g>
  <g font-size="28" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="260" y="250">سلسلة 1</text>
    <text x="940" y="250">سلسلة 2</text>
  </g>
  <text x="600" y="640" text-anchor="middle" font-size="28" fill="#334155">يتكون ADN من سلسلتين متكاملتين، والقواعد تتزاوج نوعياً: A مع T و C مع G</text>
  <text x="600" y="690" text-anchor="middle" font-size="24" fill="#475569">هذه البنية المزدوجة تسمح بتخزين المعلومة الوراثية وحفظها</text>
</svg>
