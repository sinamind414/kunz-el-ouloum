<text x="700" y="785" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#51627a">تذكّر: ARN لا يخزن المعلومة الوراثية الأصلية، بل يحمل نسخة قابلة للاستعمال.</text>
