<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" font-family="Arial, sans-serif" role="img" aria-labelledby="schema-title">
  <title id="schema-title">الاستجابة المناعية الأولية والثانوية</title>
  <rect width="900" height="580" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold">الاستجابة المناعية الأولية والثانوية</text>
  <line x1="80" y1="520" x2="840" y2="520" stroke="#000" stroke-width="2"/>
  <line x1="80" y1="520" x2="80" y2="60" stroke="#000" stroke-width="2"/>
  <text x="40" y="525" font-size="12">الزمن</text>
  <text x="30" y="300" font-size="12" transform="rotate(-90 30 300)">تركيز الأجسام المضادة</text>
  <polyline points="80,480 160,460 240,200 320,200 400,460 840,460" fill="none" stroke="#006d37" stroke-width="3"/>
  <text x="140" y="445" font-size="12">التماس الأول</text>
  <text x="300" y="185" font-size="12">استجابة أولية</text>
  <text x="420" y="445" font-size="12">التماس الثاني</text>
  <text x="620" y="185" font-size="12">استجابة ثانوية</text>
  <circle cx="240" cy="200" r="5" fill="#006d37"/>
  <circle cx="400" cy="460" r="5" fill="#ff8c42"/>
  <line x1="240" y1="200" x2="240" y2="520" stroke="#006d37" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="400" y1="460" x2="400" y2="520" stroke="#ff8c42" stroke-width="1" stroke-dasharray="4 2"/>
</svg>