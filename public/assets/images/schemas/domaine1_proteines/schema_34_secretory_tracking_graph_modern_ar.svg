<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="tracking-title tracking-desc">
<title id="tracking-title">تتبع زمني للوسم البروتيني المشع</title>
<desc id="tracking-desc">منحنيات بيانية حركية توضح انتقال الإشعاع عبر الزمن الخطي من الشبكة الهيولية إلى جهاز غولجي ثم الحويصلات الإفرازية.</desc>
<rect width="1400" height="900" fill="#f7fbff"/>
<rect x="70" y="120" width="1260" height="700" rx="28" fill="white" stroke="#d5dee8" stroke-width="4"/>
<text x="700" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#17233b">تتبع زمني للوسم البروتيني المشع</text>
<text x="700" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#51627a">انتقال الإشعاع وفق مقياس زمني خطي دقيق (5 إلى 90 دقيقة)</text>
<line x1="180" y1="640" x2="1180" y2="640" stroke="#334155" stroke-width="5"/>
<line x1="180" y1="220" x2="180" y2="640" stroke="#334155" stroke-width="5"/>
<text x="120" y="250" transform="rotate(-90 120,250)" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#17233b">شدة الإشعاع النسبية (%)</text>
<text x="1160" y="685" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#17233b">الزمن</text>
<!-- تدريجات الزمن X الخطية: x(t) = 280 + (t - 5) / 85 * 800 -->
<line x1="280" y1="640" x2="280" y2="652" stroke="#334155" stroke-width="4"/>
<text x="280" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#51627a">5 د</text>
<line x1="374" y1="640" x2="374" y2="652" stroke="#334155" stroke-width="4"/>
<text x="374" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#51627a">15 د</text>
<line x1="515" y1="640" x2="515" y2="652" stroke="#334155" stroke-width="4"/>
<text x="515" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#51627a">30 د</text>
<line x1="798" y1="640" x2="798" y2="652" stroke="#334155" stroke-width="4"/>
<text x="798" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#51627a">60 د</text>
<line x1="1080" y1="640" x2="1080" y2="652" stroke="#334155" stroke-width="4"/>
<text x="1080" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#51627a">90 د</text>

<!-- 1. منحنى الشبكة الهيولية (RER) - وردي/أحمر -->
<path d="M 280,300 C 330,340 350,400 374,420 C 430,490 480,560 515,580 C 650,610 720,620 798,624 L 1080,630" fill="none" stroke="#be185d" stroke-width="7" stroke-linecap="round"/>
<circle cx="280" cy="300" r="8" fill="#be185d" stroke="#fff" stroke-width="2"/>
<circle cx="374" cy="420" r="8" fill="#be185d" stroke="#fff" stroke-width="2"/>
<circle cx="515" cy="580" r="8" fill="#be185d" stroke="#fff" stroke-width="2"/>
<circle cx="798" cy="624" r="8" fill="#be185d" stroke="#fff" stroke-width="2"/>
<circle cx="1080" cy="630" r="8" fill="#be185d" stroke="#fff" stroke-width="2"/>

<!-- 2. منحنى جهاز غولجي - أزرق -->
<path d="M 280,620 C 310,540 340,430 374,360 C 420,300 480,290 515,310 C 620,400 720,500 798,550 L 1080,610" fill="none" stroke="#2f6fed" stroke-width="7" stroke-linecap="round" stroke-dasharray="10 5"/>
<rect x="273" y="613" width="14" height="14" fill="#2f6fed" stroke="#fff" stroke-width="2"/>
<rect x="367" y="353" width="14" height="14" fill="#2f6fed" stroke="#fff" stroke-width="2"/>
<rect x="508" y="303" width="14" height="14" fill="#2f6fed" stroke="#fff" stroke-width="2"/>
<rect x="791" y="543" width="14" height="14" fill="#2f6fed" stroke="#fff" stroke-width="2"/>
<rect x="1073" y="603" width="14" height="14" fill="#2f6fed" stroke="#fff" stroke-width="2"/>

<!-- 3. منحنى الحويصلات الإفرازية - أخضر -->
<path d="M 280,635 L 374,625 C 430,615 480,570 515,520 C 650,420 720,340 798,310 L 1080,270" fill="none" stroke="#198754" stroke-width="7" stroke-linecap="round"/>
<polygon points="280,627 288,643 272,643" fill="#198754" stroke="#fff" stroke-width="2"/>
<polygon points="374,617 382,633 366,633" fill="#198754" stroke="#fff" stroke-width="2"/>
<polygon points="515,512 523,528 507,528" fill="#198754" stroke="#fff" stroke-width="2"/>
<polygon points="798,302 806,318 790,318" fill="#198754" stroke="#fff" stroke-width="2"/>
<polygon points="1080,262 1088,278 1072,278" fill="#198754" stroke="#fff" stroke-width="2"/>

<!-- مفتاح الرسم (Légende) -->
<g transform="translate(300, 185)">
  <rect x="0" y="0" width="36" height="12" rx="6" fill="#be185d"/>
  <circle cx="18" cy="6" r="5" fill="#fff"/>
  <text x="50" y="12" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17233b">الشبكة الهيولية المحببة</text>
  
  <rect x="270" y="0" width="36" height="12" rx="6" fill="#2f6fed"/>
  <rect x="283" y="1" width="10" height="10" fill="#fff"/>
  <text x="320" y="12" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17233b">جهاز غولجي</text>
  
  <rect x="520" y="0" width="36" height="12" rx="6" fill="#198754"/>
  <polygon points="538,1 544,11 532,11" fill="#fff"/>
  <text x="570" y="12" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17233b">حويصلات إفرازية</text>
</g>

<text x="700" y="785" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#51627a">الرؤية الكمية: انتقال ذروة الإشعاع بالتتابع يثبت المسار الإفرازي: شبكة ← غولجي ← حويصلات إفرازية.</text>
</svg>