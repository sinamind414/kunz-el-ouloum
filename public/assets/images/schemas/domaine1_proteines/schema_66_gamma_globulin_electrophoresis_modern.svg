  <path d="M190 540 C245 525 265 460 300 360 C330 285 360 260 395 520 C425 580 470 555 515 520 C565 482 610 475 650 525 C710 595 795 600 840 525 C900 425 925 300 980 260 C1010 242 1035 245 1060 250" fill="none" stroke="#94a3b8" stroke-width="7"/>
  <path d="M190 540 C245 525 265 460 300 360 C330 285 360 260 395 520 C425 580 470 555 515 520 C565 482 610 475 650 525 C710 595 785 560 840 430 C900 290 948 170 1020 150 C1045 145 1065 150 1080 158" fill="none" stroke="#7c3aed" stroke-width="8"/>

