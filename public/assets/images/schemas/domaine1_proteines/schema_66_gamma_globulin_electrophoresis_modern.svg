  <rect x="160" y="680" width="880" height="42" rx="20" fill="#0f172a" opacity="0.92"/>
  <text x="600" y="708" text-anchor="middle" font-size="24" fill="#ffffff">ارتفاع منطقة γ-غلوبولين يعني زيادة البروتينات المناعية، أي زيادة الأجسام المضادة المفرزة من الخلايا البلازمية</text>
