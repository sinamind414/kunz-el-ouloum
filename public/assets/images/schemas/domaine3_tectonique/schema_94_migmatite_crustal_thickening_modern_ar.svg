<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr94" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#7f1d1d"/>
    </marker>
    <marker id="arr94b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="24" y="24" width="1152" height="712" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
  <text x="600" y="78" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">شواهد التقلص : التضاعف القشري وصخر المغماتيت (الكتاب المدرسي ص 319-321)</text>

  <!-- ======== لوحة 1 : التصادم والتضاعف القشري ======== -->
  <rect x="50" y="108" width="540" height="300" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="320" y="142" text-anchor="middle" font-size="17" font-weight="bold" fill="#7f1d1d">التصادم القاري ⟶ تقلص أفقي وتضاعف قشري</text>

  <rect x="90" y="200" width="150" height="60" fill="#fde68a" stroke="#a16207" stroke-width="3"/>
  <text x="165" y="236" text-anchor="middle" font-size="13" fill="#854d0e">لوح قاري</text>
  <rect x="410" y="200" width="150" height="60" fill="#fde68a" stroke="#a16207" stroke-width="3"/>
  <text x="485" y="236" text-anchor="middle" font-size="13" fill="#854d0e">لوح قاري</text>
  <path d="M250 230 L400 230" stroke="#7f1d1d" stroke-width="3" marker-end="url(#arr94)"/>
  <path d="M400 230 L250 230" stroke="#7f1d1d" stroke-width="3" marker-end="url(#arr94)"/>
  <text x="325" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">تقلص أفقي</text>

  <path d="M180 290 Q325 230 470 290" fill="none" stroke="#7c2d12" stroke-width="4"/>
  <text x="325" y="312" text-anchor="middle" font-size="13" fill="#7c2d12">طية محدبة : سلسلة جبلية عالية ومتجذرة</text>
  <path d="M325 320 L325 380" stroke="#7f1d1d" stroke-width="3" marker-end="url(#arr94)"/>
  <text x="325" y="398" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7f1d1d">زيادة سمك الليتوسفير (جذر جبلي)</text>

  <!-- ======== لوحة 2 : المغماتيت ======== -->
  <rect x="610" y="108" width="540" height="300" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="880" y="142" text-anchor="middle" font-size="17" font-weight="bold" fill="#4c1d95">صخر المغماتيت : شاهد التضاعف القشري</text>

  <rect x="660" y="170" width="200" height="130" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/>
  <g stroke="#7c3aed" stroke-width="7" fill="none">
    <path d="M670 200 Q760 180 850 205"/>
    <path d="M670 232 Q760 212 850 237"/>
    <path d="M670 264 Q760 244 850 269"/>
  </g>
  <g fill="#db2777">
    <circle cx="700" cy="196" r="4"/><circle cx="760" cy="189" r="4"/><circle cx="820" cy="200" r="4"/>
    <circle cx="730" cy="228" r="4"/><circle cx="790" cy="221" r="4"/>
  </g>
  <text x="760" y="322" text-anchor="middle" font-size="12.5" fill="#5b21b6">تناوب : كوارتز-غرونا-ميكا-بلاجيوكلاز مع صفوف أومفيبوليت</text>

  <text x="1010" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">معادن مميزة</text>
  <text x="1010" y="228" text-anchor="middle" font-size="13" fill="#5b21b6">الغرونا (Grenat)</text>
  <text x="1010" y="252" text-anchor="middle" font-size="13" fill="#5b21b6">الميكا (البيوتيت)</text>
  <text x="1010" y="276" text-anchor="middle" font-size="13" fill="#5b21b6">الكوارتز + البلاجيوكلاز</text>
  <text x="1010" y="306" text-anchor="middle" font-size="12.5" fill="#6d28d9">صفوف متموجة (Litage contourné)</text>

  <!-- ======== Chaine causale ======== -->
  <rect x="60" y="432" width="1080" height="96" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="600" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">السلسلة السببية : تصادم ⟶ تقلص ⟶ تضاعف قشري ⟶ ارتفاع الحرارة والضغط ⟶ انصهار جزئي للغرانيت ⟶ تبلور المغماتيت</text>
  <g font-size="12.5" fill="#1e40af">
    <text x="150" y="502" text-anchor="middle">1. تصادم قاري</text>
    <text x="360" y="502" text-anchor="middle">2. تقلص أفقي</text>
    <text x="570" y="502" text-anchor="middle">3. تضاعف قشري</text>
    <text x="780" y="502" text-anchor="middle">4. انصهار جزئي للغرانيت</text>
    <text x="1010" y="502" text-anchor="middle">5. مغماتيت متجذر</text>
  </g>
  <g stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arr94b)">
    <line x1="230" y1="497" x2="290" y2="497"/><line x1="440" y1="497" x2="500" y2="497"/>
    <line x1="650" y1="497" x2="710" y2="497"/><line x1="880" y1="497" x2="940" y2="497"/>
  </g>

  <!-- ======== شواهد ميدانية ======== -->
  <rect x="60" y="548" width="1080" height="164" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
  <text x="600" y="582" text-anchor="middle" font-size="16" font-weight="bold" fill="#065f46">شواهد ميدانية من السلسلة المغاربية (تمارين الكتاب ص 332-334)</text>
  <text x="600" y="616" text-anchor="middle" font-size="14" fill="#047857">محطة 2 (جبال تاكسانة) : مغماتيت = كوارتز + غرونا + بلاجيوكلاز + ميكا + فلسبار ⟶ دليل التضاعف القشري</text>
  <text x="600" y="648" text-anchor="middle" font-size="14" fill="#047857">محطة 4 : بيريدوتيت (سربنتين + كالسيت) ⟶ بقايا الليتوسفير المحيطي (الأفيوليت) = شاهد محيط قديم</text>
  <text x="600" y="680" text-anchor="middle" font-size="13.5" fill="#065f46">الخلاصة : التصادم ينتج سلسلة عالية ومتجذرة، والمغماتيت هو الشاهد البتروغرافي على الجذر</text>
</svg>