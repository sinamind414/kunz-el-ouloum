<text x="480.0" y="534" text-anchor="middle" font-size="15" fill="#475569" font-family="Noto Naskh Arabic, Amiri, serif">المشترك : تدرج H⁺ عبر غشاء + كرة مذنبة. المختلف : مصدر الإلكترونات ومستقبلها النهائي.</text>
