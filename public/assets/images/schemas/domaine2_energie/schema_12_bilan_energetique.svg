<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="الحصيلة الطاقوية العامة" role="img" class="pfe-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550"><defs><marker id="pf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" fill="context-stroke"><path d="M 1 1 L 9 5 L 1 9 z"/></marker></defs>
<defs><style>text{font-family:'Noto Kufi Arabic','Segoe UI',system-ui,sans-serif;}
.title,.t{font-size:21px;font-weight:800;fill:#0F2A1D;}
.subtitle{font-size:13px;fill:#6B7280;}
.label-ar,.la{font-size:14px;font-weight:700;fill:#1A2A3A;}
.label-fr{font-size:12px;fill:#6B7280;}
.label-small,.ls{font-size:11px;fill:#6B7280;}
.label-white,.lw{font-size:12px;font-weight:700;fill:#FFFFFF;}</style><linearGradient id="pf-kunzBg" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0%" stop-color="#F7FAF8"/>
   <stop offset="100%" stop-color="#EFF4F1"/>
  </linearGradient>
  <filter id="pf-kunzShadow" x="-5%" y="-5%" width="110%" height="110%">
   <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#006d37" flood-opacity="0.06"/>
  </filter>
 </defs>
<rect width="800" height="550" fill="url(#pf-kunzBg)"/>
 <rect x="8" y="8" width="784" height="534" rx="20" fill="none" stroke="#E3EAE6" stroke-width="2" filter="url(#pf-kunzShadow)"/>
<text x="400" y="25" text-anchor="middle" class="t">الحصيلة الطاقوية العامة</text>

<!-- Central ATP
 -->
<g transform="translate(400, 280)">
 <circle cx="0" cy="0" r="60" fill="#FFD700" stroke="#F57F17" stroke-width="3"/>
 <text x="0" y="-10" text-anchor="middle" style="font-size:22px;font-weight:bold;fill:#1A2A3A">ATP</text>
 <text x="0" y="10" text-anchor="middle" class="ls">الطاقة</text>
 <text x="0" y="30" text-anchor="middle" style="font-size:11px;fill:#7F8C8D">للخلية</text>
</g>

<!-- LEFT: Photosynthesis -->
<g transform="translate(150, 145)">
 <rect x="-100" y="-30" width="200" height="70" rx="10" fill="#E8F5E9" stroke="#2ECC71" stroke-width="2"/>
 <circle cx="-84" cy="-5" r="5" fill="#F59E0B"/>
 <text x="0" y="-5" text-anchor="middle" class="la" fill="#2ECC71">التركيب الضوئي</text>
 <text x="0" y="12" text-anchor="middle" class="ls">CO₂ + H₂O + ضوء ⟶ غلوكوز + O₂</text>
 <text x="0" y="28" text-anchor="middle" class="ls">يخزن الطاقة في روابط الجلوكوز</text>
</g>

<!-- RIGHT: Respiration -->
<g transform="translate(650, 145)">
 <rect x="-100" y="-30" width="200" height="70" rx="10" fill="#FCE4EC" stroke="#C62828" stroke-width="2"/>
 <path d="M-84 -12l-5 9h5l-2 8 8-11h-5l2-6Z" fill="#F59E0B"/>
 <text x="0" y="-5" text-anchor="middle" class="la" fill="#C62828">التنفس الخلوي</text>
 <text x="0" y="12" text-anchor="middle" class="ls">غلوكوز + O₂ ⟶ CO₂ + H₂O + ATP</text>
 <text x="0" y="28" text-anchor="middle" class="ls">يحرر الطاقة من روابط الجلوكوز</text>
</g>

<!-- Arrows -->
<path d="M 250,185 C 285,205 315,230 345,250" fill="none" stroke="#2ECC71" stroke-width="2" marker-end="url(#pf-arrow)"/>
<path d="M 550,185 C 515,205 485,230 455,250" fill="none" stroke="#C62828" stroke-width="2" marker-end="url(#pf-arrow)"/>

<!-- ATP supplies the cell's energy-consuming processes; arrows stay outside the card. -->
<path d="M 350,325 C 310,350 260,370 205,380" fill="none" stroke="#2ECC71" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#pf-arrow)"/>
<path d="M 450,325 C 490,350 540,370 595,380" fill="none" stroke="#C62828" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#pf-arrow)"/>

<!-- BOTTOM: Uses -->
<g transform="translate(400, 390)">
 <rect x="-280" y="0" width="560" height="70" rx="10" fill="#F5F5F5" stroke="#7F8C8D" stroke-width="1.5"/>
 <g fill="none" stroke="#006d37" stroke-width="1.6" stroke-linecap="round"><circle cx="-215" cy="35" r="6"/><path d="M-215 29v12m-6-6h12"/></g>
 <circle cx="-85" cy="35" r="5" fill="#0EA5E9"/>
 <path d="M59 35l6-6 6 6-6 6Z" fill="#8B5CF6"/>
 <path d="M184 29l-5 7h5l-2 6 8-9h-5l2-4Z" fill="#F59E0B"/>
 <text x="0" y="18" text-anchor="middle" class="la">استخدامات ATP في الخلية</text>
 <text x="-200" y="40" class="ls">تقلص عضلي</text>
 <text x="-70" y="40" class="ls">نقل نشط (Na⁺/K⁺)</text>
 <text x="80" y="40" class="ls">تركيب حيوي</text>
 <text x="200" y="40" class="ls">نبض عصبي</text>
</g>


<!-- Bottom cycle -->
<g transform="translate(400, 55)">
 <g fill="none" stroke="#006d37" stroke-width="1.5"><circle cx="102" cy="8" r="7"/><path d="M102 1v14m-7-7h14"/></g>

 <text x="0" y="10" text-anchor="middle" style="font-size:13px;font-weight:bold;fill:#1A2A3A">دورة الكربون</text>
 <text x="0" y="28" text-anchor="middle" class="ls" font-size="11">التركيب الضوئي: CO₂ ⟶ غلوكوز</text>
 <text x="0" y="42" text-anchor="middle" class="ls" font-size="11">التنفس: غلوكوز ⟶ CO₂</text>
</g>

<text x="400" y="540" text-anchor="middle" class="ls">كنز العلوم — علوم الطبيعة والحياة 3AS</text>
</svg>
