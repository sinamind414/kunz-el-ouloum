<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr90" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="24" y="24" width="1152" height="712" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
  <text x="600" y="80" text-anchor="middle" font-size="25" font-weight="bold" fill="#0f172a">تجربة جاغندورف (1966) : تركيب ATP في الظلام عند فرق pH صناعي</text>

  <!-- ======== المرحلة 1 ======== -->
  <rect x="60" y="122" width="260" height="330" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="190" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">المرحلة 1 — في الظلام</text>
  <circle cx="190" cy="290" r="72" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/>
  <circle cx="190" cy="290" r="52" fill="#bae6fd"/>
  <g fill="#1d4ed8">
    <circle cx="165" cy="270" r="7"/><circle cx="215" cy="265" r="7"/><circle cx="230" cy="305" r="7"/>
    <circle cx="180" cy="320" r="7"/><circle cx="205" cy="295" r="7"/>
  </g>
  <text x="190" y="238" text-anchor="middle" font-size="13" fill="#1e3a8a">كييسات (ثيلاكويدات) معزولة</text>
  <text x="190" y="430" text-anchor="middle" font-size="14" fill="#1e3a8a">محلول pH = 4 : دخول H⁺ إلى التجويف</text>

  <!-- ======== المرحلة 2 ======== -->
  <rect x="348" y="122" width="260" height="330" rx="16" fill="#fefce8" stroke="#facc15" stroke-width="2"/>
  <text x="478" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#713f12">المرحلة 2 — في الظلام</text>
  <path d="M440 200 L540 200" stroke="#713f12" stroke-width="3" marker-end="url(#arr90)"/>
  <circle cx="478" cy="300" r="72" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/>
  <circle cx="478" cy="300" r="52" fill="#bae6fd"/>
  <g fill="#1d4ed8">
    <circle cx="453" cy="280" r="7"/><circle cx="503" cy="275" r="7"/><circle cx="518" cy="315" r="7"/>
    <circle cx="468" cy="330" r="7"/><circle cx="493" cy="305" r="7"/>
  </g>
  <text x="478" y="248" text-anchor="middle" font-size="13" fill="#713f12">نقل إلى محلول pH = 8</text>
  <text x="478" y="430" text-anchor="middle" font-size="14" fill="#713f12">وسط خارجي فيه ADP + Pi</text>

  <!-- ======== المرحلة 3 ======== -->
  <rect x="636" y="122" width="260" height="330" rx="16" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="766" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#7f1d1d">المرحلة 3 — عودة H⁺</text>
  <circle cx="766" cy="300" r="72" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/>
  <circle cx="766" cy="300" r="52" fill="#bae6fd"/>
  <rect x="754" y="336" width="24" height="42" fill="#7c3aed" rx="4"/>
  <circle cx="766" cy="396" r="16" fill="#a78bfa"/>
  <g fill="#1d4ed8">
    <circle cx="742" cy="276" r="7"/><circle cx="792" cy="272" r="7"/><circle cx="806" cy="312" r="7"/>
    <circle cx="756" cy="326" r="7"/>
  </g>
  <path d="M766 356 L766 416" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arr90)"/>
  <text x="766" y="238" text-anchor="middle" font-size="13" fill="#7f1d1d">H⁺ يعبر الكرية المذنبة</text>
  <text x="766" y="430" text-anchor="middle" font-size="14" fill="#7f1d1d">بلا ضوء — تدرج داخلي فقط</text>

  <!-- ======== النتيجة ======== -->
  <rect x="924" y="122" width="216" height="330" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="1032" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#065f46">النتيجة — في الظلام</text>
  <rect x="984" y="210" width="96" height="44" rx="10" fill="#ffffff" stroke="#059669" stroke-width="3"/>
  <text x="1032" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#059669">ATP</text>
  <path d="M1000 280 L1064 280 L1032 320 Z" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="1032" y="368" text-anchor="middle" font-size="13.5" fill="#065f46">ADP + Pi ⟶ ATP</text>
  <text x="1032" y="402" text-anchor="middle" font-size="13.5" fill="#065f46">بدون أي إضاءة</text>
  <text x="1032" y="436" text-anchor="middle" font-size="13.5" fill="#065f46">فرق pH كافٍ للطاقة</text>

  <!-- ======== شريط الاستنتاج ======== -->
  <rect x="120" y="500" width="960" height="192" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/>
  <text x="600" y="546" text-anchor="middle" font-size="18" font-weight="bold" fill="#4c1d95">الاستنتاج : لا يتركب ATP بفعل الضوء مباشرة، بل بفعل تدرج البروتونات H⁺</text>
  <text x="600" y="584" text-anchor="middle" font-size="15" fill="#5b21b6">دور الضوء في الصانعة : تحريك الإلكترونات وتكوين تدرج H⁺ عبر غشاء التيلاكويد</text>
  <text x="600" y="622" text-anchor="middle" font-size="15" fill="#5b21b6">عودة H⁺ عبر الكرية المذنبة (ATP-synthase) تشكل الـ ATP : إثبات النظرية الكيمياؤسموزية لميتشل</text>
  <text x="600" y="660" text-anchor="middle" font-size="14" fill="#6d28d9">عند إماهة رابطة في ATP تتحرر الطاقة القابلة للاستعمال في كل وظائف الخلية</text>
</svg>