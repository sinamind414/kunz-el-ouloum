<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr89" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="24" y="24" width="1152" height="712" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
  <text x="600" y="80" text-anchor="middle" font-size="25" font-weight="bold" fill="#0f172a">تجربة هيل (1937) وتجربة روبن (1941) : ما مصدر الأكسجين المنطلق؟</text>

  <!-- ======== لوحة 1 : تجربة هيل ======== -->
  <rect x="60" y="112" width="520" height="440" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="320" y="150" text-anchor="middle" font-size="19" font-weight="bold" fill="#14532d">تجربة هيل : الصانعات المعزولة + ضوء</text>

  <circle cx="128" cy="222" r="24" fill="#fbbf24"/>
  <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round">
    <line x1="128" y1="186" x2="128" y2="172"/><line x1="128" y1="258" x2="128" y2="272"/>
    <line x1="92" y1="222" x2="78" y2="222"/><line x1="164" y1="222" x2="178" y2="222"/>
    <line x1="103" y1="197" x2="93" y2="187"/><line x1="153" y1="247" x2="163" y2="257"/>
    <line x1="103" y1="247" x2="93" y2="257"/><line x1="153" y1="197" x2="163" y2="187"/>
  </g>
  <text x="128" y="300" text-anchor="middle" font-size="13" fill="#b45309">ضوء</text>

  <path d="M310 200 L272 384 Q264 414 296 414 L424 414 Q456 414 448 384 L410 200 Z" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
  <text x="360" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#0369a1">صانعات خضراء معزولة</text>
  <g fill="#16a34a">
    <ellipse cx="320" cy="300" rx="14" ry="9"/><ellipse cx="368" cy="318" rx="14" ry="9"/>
    <ellipse cx="402" cy="292" rx="14" ry="9"/><ellipse cx="336" cy="352" rx="14" ry="9"/>
    <ellipse cx="392" cy="362" rx="14" ry="9"/>
  </g>
  <text x="360" y="404" text-anchor="middle" font-size="12.5" fill="#b91c1c">وسم بـ Fe³⁺ (مستقبل اصطناعي) — وسط خالٍ من CO₂</text>
  <g fill="#38bdf8">
    <circle cx="292" cy="262" r="6"/><circle cx="308" cy="244" r="5"/>
    <circle cx="420" cy="256" r="6"/><circle cx="432" cy="238" r="5"/>
  </g>
  <path d="M470 306 L536 306" stroke="#0f172a" stroke-width="3" marker-end="url(#arr89)"/>
  <text x="503" y="292" text-anchor="middle" font-size="13" fill="#0f172a">انطلاق</text>
  <text x="534" y="342" text-anchor="middle" font-size="16" font-weight="bold" fill="#0284c7">O₂ + Fe²⁺</text>

  <!-- ======== لوحة 2 : تجربة روبن ======== -->
  <rect x="620" y="112" width="520" height="440" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="880" y="150" text-anchor="middle" font-size="19" font-weight="bold" fill="#7c2d12">تجربة روبن : وسم الأكسجين بـ ¹⁸O</text>

  <ellipse cx="745" cy="402" rx="72" ry="56" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
  <rect x="721" y="278" width="48" height="84" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
  <text x="745" y="332" text-anchor="middle" font-size="13" fill="#0c4a6e">C¹⁶O₂</text>
  <text x="745" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">H₂¹⁸O</text>
  <text x="745" y="484" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">O₂ المنطلق : مُوسَم ¹⁸O</text>

  <ellipse cx="1015" cy="402" rx="72" ry="56" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
  <rect x="991" y="278" width="48" height="84" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
  <text x="1015" y="332" text-anchor="middle" font-size="13" fill="#0c4a6e">C¹⁸O₂</text>
  <text x="1015" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">H₂¹⁶O</text>
  <text x="1015" y="484" text-anchor="middle" font-size="15" font-weight="bold" fill="#475569">O₂ المنطلق : غير مُوسَم</text>

  <text x="880" y="530" text-anchor="middle" font-size="14" fill="#7c2d12">الوسم يتبع الماء : الأكسجين يأتي من H₂O</text>

  <!-- ======== شريط الاستنتاج ======== -->
  <rect x="120" y="586" width="960" height="106" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
  <text x="600" y="630" text-anchor="middle" font-size="18" font-weight="bold" fill="#065f46">الاستنتاج : الأكسجين المنطلق مصدره الماء وليس CO₂</text>
  <text x="600" y="666" text-anchor="middle" font-size="15" fill="#047857">التحلل الضوئي للماء يوفر الإلكترونات ويحرر الأكسجين : 2H₂O ⟶ 4H⁺ + 4e⁻ + O₂</text>
</svg>