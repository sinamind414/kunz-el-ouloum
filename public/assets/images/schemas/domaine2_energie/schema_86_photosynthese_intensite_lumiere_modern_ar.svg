<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" font-family="Arial, sans-serif" role="img" aria-labelledby="schema-title">
  <title id="schema-title">معدل البناء الضوئي بدلالة شدة الإضاءة</title>
  <rect width="900" height="580" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold">معدل البناء الضوئي بدلالة شدة الإضاءة</text>
  <line x1="80" y1="520" x2="840" y2="520" stroke="#000" stroke-width="2"/>
  <line x1="80" y1="520" x2="80" y2="60" stroke="#000" stroke-width="2"/>
  <text x="40" y="525" font-size="12">0</text>
  <text x="40" y="290" font-size="12">نصف</text>
  <text x="30" y="110" font-size="12">أقصى</text>
  <line x1="70" y1="520" x2="90" y2="520" stroke="#000"/>
  <line x1="70" y1="290" x2="90" y2="290" stroke="#000"/>
  <line x1="70" y1="110" x2="90" y2="110" stroke="#000"/>
  <text x="100" y="535" font-size="12">شدة الإضاءة</text>
  <text x="30" y="300" font-size="12" transform="rotate(-90 30 300)">معدل البناء الضوئي</text>
  <polyline points="80,520 200,520 400,110 840,110" fill="none" stroke="#006d37" stroke-width="3"/>
  <text x="200" y="545" text-anchor="middle" font-size="12">حد الإضاءة</text>
  <text x="400" y="95" text-anchor="middle" font-size="12">أقصى معدل</text>
  <circle cx="80" cy="520" r="5" fill="#006d37"/>
  <circle cx="400" cy="110" r="5" fill="#ff8c42"/>
</svg>