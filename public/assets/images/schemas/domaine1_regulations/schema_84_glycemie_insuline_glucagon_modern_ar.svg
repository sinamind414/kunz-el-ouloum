<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" font-family="Arial, sans-serif" role="img" aria-labelledby="schema-title">
  <title id="schema-title">التنظيم الهرموني: الأنسولين والغلوكاغون</title>
  <rect width="900" height="580" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold">التنظيم الهرموني: الأنسولين والغلوكاغون</text>
  <line x1="80" y1="520" x2="840" y2="520" stroke="#000" stroke-width="2"/>
  <line x1="80" y1="520" x2="80" y2="60" stroke="#000" stroke-width="2"/>
  <text x="40" y="525" font-size="12">الزمن (دقيقة)</text>
  <text x="30" y="300" font-size="12" transform="rotate(-90 30 300)">نسبة السكر (g/L)</text>
  <polyline points="80,520 280,110 680,520" fill="none" stroke="#006d37" stroke-width="3"/>
  <circle cx="80" cy="520" r="5" fill="#006d37"/>
  <circle cx="280" cy="110" r="5" fill="#ff8c42"/>
  <circle cx="680" cy="520" r="5" fill="#006d37"/>
  <text x="85" y="500" font-size="12">0,9 g/L</text>
  <text x="285" y="90" font-size="12">1,6 g/L</text>
  <text x="685" y="500" font-size="12">0,9 g/L</text>
  <rect x="320" y="360" width="260" height="80" fill="#e5f6ed" stroke="#006d37" stroke-width="2"/>
  <text x="450" y="390" text-anchor="middle" font-size="14">بنكرياس</text>
  <text x="450" y="410" text-anchor="middle" font-size="12">خلية بيتا → أنسولين</text>
  <text x="450" y="430" text-anchor="middle" font-size="12">خلية ألفا → غلوكاغون</text>
  <line x1="380" y1="360" x2="240" y2="140" stroke="#006d37" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="520" y1="360" x2="760" y2="140" stroke="#ff8c42" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="340" y="200" font-size="12">أنسولين</text>
  <text x="640" y="200" font-size="12">غلوكاغون</text>
</svg>